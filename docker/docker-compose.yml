version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mcp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mcp_test
      MYSQL_USER: mcp_user
      MYSQL_PASSWORD: mcp_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MCP Server for MySQL
  mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mcp-server-mysql
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: mcp_user
      MYSQL_PASS: mcp_password
      MYSQL_DB: mcp_test
      TABLE_WRITE_WHITELIST: "mcp_test.*"
      ENABLE_LOGGING: "true"
    depends_on:
      mysql:
        condition: service_healthy
    # Uncomment if using remote MCP mode
    # ports:
    #   - "3000:3000"
    # environment:
    #   IS_REMOTE_MCP: "true"
    #   REMOTE_SECRET_KEY: "your-secret-key"
    #   PORT: "3000"

volumes:
  mysql_data:
    driver: local
